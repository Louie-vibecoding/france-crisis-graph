<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>法国危机关系图谱</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: Obsidian vault — ribbon | search pane | split main (graph view on top, note below) */
:root{
  --bg:#1e1e1e; --bg-2:#262626; --bg-3:#2f2f2f; --border:#363636; --hover:rgba(255,255,255,.06);
  --text:#dcddde; --muted:#999; --faint:#666; --accent:#a68af9; --accent-strong:#8a5cf5;
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:14px/1.5 var(--font-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.window{display:grid;grid-template-columns:44px 250px minmax(0,1fr);grid-template-rows:minmax(0,1fr);height:min(94vh,940px);min-height:660px;border:1px solid var(--border);border-radius:10px;overflow:hidden;background:var(--bg)}
.ribbon{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.ribbon i{width:28px;height:28px;display:grid;place-items:center;border-radius:5px;color:var(--faint)}
.ribbon i.on{color:var(--text);background:var(--hover)}
.pane{background:var(--bg-2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
.pane-head{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--border);color:var(--faint)}
.pane-head span{width:26px;height:24px;display:grid;place-items:center;border-radius:4px}
.pane-head span.on{color:var(--text);background:var(--hover)}
.search{display:flex;align-items:center;gap:6px;margin:10px;padding:5px 8px;background:var(--bg);border:1px solid var(--border);border-radius:5px;color:var(--faint)}
.search:focus-within{border-color:var(--accent-strong)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:13px var(--font-ui)}
.search button{color:var(--faint);width:18px;height:18px;display:grid;place-items:center;border-radius:50%}
.search button:hover{color:var(--text)}
.meta{display:flex;justify-content:space-between;padding:0 12px 6px;font-size:12px;color:var(--muted)}
.list{flex:1;overflow:auto;padding:0 6px 10px}
.group-h{display:flex;align-items:center;gap:6px;padding:8px 6px 4px;font-size:12px;color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.item{display:flex;align-items:center;gap:8px;width:100%;padding:3px 8px 3px 19px;text-align:left;border-radius:4px;font-size:13px}
.item:hover{background:var(--hover)}
.item.on{background:rgba(138,92,245,.2);color:#fff}
.item .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .deg{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;background:var(--hover);padding:0 6px;border-radius:8px}
.main{display:grid;grid-template-rows:minmax(0,1.3fr) minmax(0,1fr);min-width:0;min-height:0}
.gpane,.npane{display:flex;flex-direction:column;min-height:0;position:relative;overflow:hidden}
.gpane{border-bottom:1px solid var(--border)}
.tabbar{display:flex;align-items:flex-end;height:38px;background:var(--bg-2);border-bottom:1px solid var(--border);padding:0 8px;flex:none}
.tab{display:flex;align-items:center;gap:8px;height:30px;max-width:280px;padding:0 10px 0 12px;background:var(--bg);border:1px solid var(--border);border-bottom:0;border-radius:8px 8px 0 0;font-size:13px;margin-bottom:-1px}
.tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab .pin{color:var(--accent)}
.tab button{width:18px;height:18px;display:grid;place-items:center;border-radius:4px;color:var(--faint)}
.tab button:hover{background:var(--hover);color:var(--text)}
.crumb{display:flex;align-items:center;justify-content:center;height:34px;font-size:13px;color:var(--muted);position:relative;flex:none;padding:0 70px}
.crumb > span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navs{position:absolute;left:10px;display:flex;gap:2px;color:var(--faint)}
.navs button,.navs span{width:24px;height:24px;display:grid;place-items:center;border-radius:4px}
.navs button:hover:not(:disabled){background:var(--hover);color:var(--text)}
.navs button:disabled{opacity:.35;cursor:default}
.wrap{position:relative;flex:1;min-height:0;overflow:hidden}
canvas{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:grab;touch-action:none}
canvas.dragging{cursor:grabbing}
.tools{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:8px}
.tgroup{display:flex;flex-direction:column;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;padding:3px}
.tgroup button{width:30px;height:30px;display:grid;place-items:center;border-radius:5px;color:var(--muted)}
.tgroup button:hover,.tgroup button.on{background:var(--hover);color:var(--text)}
.controls{position:absolute;top:10px;right:52px;width:236px;max-height:calc(100% - 20px);overflow:auto;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.ctl-head{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 6px 12px;color:var(--muted);font-size:12px}
.ctl-head button{width:26px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.ctl-head button:hover{background:var(--hover);color:var(--text)}
.sec{border-top:1px solid var(--border)}
.sec > summary{list-style:none;cursor:pointer;padding:8px 12px;font-weight:500;display:flex;align-items:center;gap:6px}
.sec > summary::-webkit-details-marker{display:none}
.sec > summary::before{content:"›";display:inline-block;width:10px;color:var(--muted);transition:transform .15s}
.sec[open] > summary::before{transform:rotate(90deg)}
.sec .body{padding:2px 12px 12px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--muted)}
.row label{flex:1;display:flex;align-items:center;gap:8px}
.row label.g{color:var(--text)}
.toggle{position:relative;width:32px;height:18px;flex:none}
.toggle input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.toggle span{position:absolute;inset:0;background:#454545;border-radius:9px;transition:background .15s;pointer-events:none}
.toggle span::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#e6e6e6;transition:transform .15s}
.toggle input:checked + span{background:var(--accent-strong)}
.toggle input:checked + span::after{transform:translateX(14px)}
.toggle input:focus-visible + span{outline:2px solid var(--accent);outline-offset:2px}
.slider{display:flex;flex-direction:column;gap:4px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--accent-strong)}
.legend{display:flex;flex-direction:column;gap:4px;color:var(--muted);font-size:12px}
.legend div{display:flex;align-items:center;gap:8px}
.btn{background:var(--accent-strong);color:#fff;border-radius:5px;padding:6px 10px}
.btn:hover{filter:brightness(1.12)}
.nscroll{flex:1;overflow:auto;min-height:0}
.note{max-width:700px;margin:0 auto;padding:14px 28px 56px;font-size:15px;line-height:1.75}
.note h1{font-size:26px;line-height:1.3;font-weight:700;margin:6px 0 8px;text-wrap:balance}
.note h2{font-size:17px;font-weight:600;margin:26px 0 8px}
.note p{margin:0 0 12px}
.note a{color:var(--accent);text-decoration:none}
.note a:hover{text-decoration:underline}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.chip{font-size:13px;color:var(--accent);background:rgba(166,138,249,.15);padding:1px 9px;border-radius:12px}
.facts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.facts li{padding:10px 14px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px;font-size:14px;line-height:1.7}
.facts b{display:block;font-weight:600;color:#fff;font-size:14px}
.facts a{font-size:12px;margin-left:4px}
.rels{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rels li{padding:8px 12px;background:var(--bg-2);border:1px solid var(--border);border-radius:8px}
.rel{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font-weight:500;color:var(--accent);font-size:14px}
.rel:hover .rl{text-decoration:underline}
.rn{font-size:13px;color:var(--muted);line-height:1.65;margin-top:2px}
.s{font-size:11px;padding:0 7px;border-radius:9px;border:1px solid var(--border);font-weight:400;margin-left:auto}
.s.strong{color:#3ccf8e}.s.weak{color:#6aa9f0}.s.contested{color:#f5c445}
.srcs{margin-top:22px;font-size:13px;color:var(--muted)}
.srcs summary{cursor:pointer;color:var(--text);font-weight:600;font-size:15px}
.srcs ol{padding-left:20px;line-height:1.9}
.srcs a{word-break:break-all}
.status{position:absolute;right:0;bottom:0;padding:3px 12px;font-size:12px;color:var(--muted);background:var(--bg-2);border:1px solid var(--border);border-right:0;border-bottom:0;border-radius:8px 0 0 0;font-variant-numeric:tabular-nums}
@media (max-width:760px){
  .window{grid-template-columns:1fr;grid-template-rows:auto;height:auto;min-height:0}
  .ribbon,.pane{display:none}
  .main{grid-template-rows:62vh auto}
  .gpane{min-height:420px}
  .nscroll{overflow:visible}
  .note{padding:12px 4px 48px}
  .crumb{padding:0 50px}
  .controls{right:50px;width:min(236px,calc(100% - 62px))}
}
</style>
</head>
<body>
<div class="window">
  <nav class="ribbon" aria-hidden="true">
    <i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"/></svg></i>
    <i class="on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="8" r="2.5"/><circle cx="10" cy="18" r="2.5"/><path d="M8 7l7.5 1M7 8l2 8M12 17l4.5-7"/></svg></i>

    <i><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h11v13H8zM5 7v13h11"/></svg></i>
  </nav>
  <aside class="pane">
    <div class="pane-head" aria-hidden="true">
      <span><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7h6l2 2h10v10H3z"/></svg></span>
      <span class="on"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>

      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

        <div class="tools">
          <div class="tgroup">
            <button id="t-set" type="button" aria-label="图谱设置" title="图谱设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>

<script>
(()=>{
const $=s=>document.querySelector(s);
const G=window.GRAPH, GROUPS=G.groups, gkeys=Object.keys(GROUPS);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const FONT=getComputedStyle(document.documentElement).getPropertyValue("--font-ui").trim();
const SNAME={strong:"较直接",weak:"间接",contested:"有争议"};
const ACC="#a68af9", BG="#1e1e1e", LINE="#4d4d4d", TEXT="#c9c9c9";
const gc=g=>(GROUPS[g]||{color:"#999999"}).color;
const gname=g=>(GROUPS[g]||{name:g}).name;
const rgb=h=>{h=h.replace("#","");return[0,2,4].map(i=>parseInt(h.slice(i,i+2),16))};
const rgba=(h,a)=>`rgba(${rgb(h).join(",")},${a})`;
const mix=(a,b,t)=>{const A=rgb(a),B=rgb(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(",")})`};

const byId=new Map(G.nodes.map(n=>[n.id,n]));
G.links=G.links.filter(l=>byId.has(l.source)&&byId.has(l.target));
const deg=new Map(G.nodes.map(n=>[n.id,0]));
G.links.forEach(l=>{deg.set(l.source,deg.get(l.source)+1);deg.set(l.target,deg.get(l.target)+1)});
const adj=new Map(G.nodes.map(n=>[n.id,new Set()]));
G.links.forEach(l=>{adj.get(l.source).add(l.target);adj.get(l.target).add(l.source)});

const nodes=G.nodes.map(n=>({...n,a:1,ta:1}));
const links=G.links.map((l,i)=>({...l,a:1,ta:1,h:0,th:0,seed:(i*.618)%1}));
const S={hidden:new Set(),weak:true,cont:true,arrow:true,hull:true,flow:!reduced,fade:.55,size:1,line:1,hover:null,sel:null,q:""};
const R=d=>(4.5+Math.sqrt(deg.get(d.id))*2.6)*S.size;
const nodeOn=n=>!S.hidden.has(n.group);
const linkOn=l=>(l.strength!=="weak"||S.weak)&&(l.strength!=="contested"||S.cont)&&nodeOn(l.source)&&nodeOn(l.target);
const match=n=>!S.q||n.label.includes(S.q)||n.note.includes(S.q);

const anchor={};
gkeys.forEach((g,i)=>{const t=-Math.PI*.75+i/gkeys.length*Math.PI*2;anchor[g]=[Math.cos(t)*240,Math.sin(t)*150]});
const ax=d=>(anchor[d.group]||[0,0])[0], ay=d=>(anchor[d.group]||[0,0])[1];
const DEF={cluster:.08,repel:300,link:.4,dist:85};
const sim=d3.forceSimulation(nodes)
  .force("link",d3.forceLink(links).id(d=>d.id).distance(DEF.dist).strength(DEF.link))
  .force("charge",d3.forceManyBody().strength(-DEF.repel))
  .force("collide",d3.forceCollide(d=>R(d)+22).iterations(2))
  .force("x",d3.forceX(ax).strength(DEF.cluster))
  .force("y",d3.forceY(ay).strength(DEF.cluster))
  .stop();
for(let i=0;i<600;i++)sim.tick();

const cv=$("#cv"),ctx=cv.getContext("2d"),wrap=$("#wrap");
let W=0,H=0,dpr=1,T=d3.zoomIdentity;
function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=wrap.clientWidth;H=wrap.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr)}

function retarget(){
  const f=S.hover||S.sel, nb=f?adj.get(f):null;
  nodes.forEach(n=>{n.ta=!nodeOn(n)?0:f?(n.id===f||nb.has(n.id)?1:.15):(match(n)?1:.15)});
  links.forEach(l=>{const on=linkOn(l),hit=!!f&&(l.source.id===f||l.target.id===f);
    l.ta=!on?0:f?(hit?1:.06):(S.q?(match(l.source)&&match(l.target)?1:.07):1);l.th=hit?1:0});
}

const hullLine=d3.line().curve(d3.curveCatmullRomClosed.alpha(.5)).context(ctx);
function drawHulls(f){
  const fg=f?byId.get(f).group:null;
  for(const g of gkeys){
    if(S.hidden.has(g))continue;
    const ms=nodes.filter(n=>n.group===g);if(!ms.length)continue;
    const pts=[];
    ms.forEach(n=>{const r=R(n)+28;for(let k=0;k<12;k++){const t=k/12*Math.PI*2;pts.push([n.x+Math.cos(t)*r,n.y+Math.sin(t)*r])}});
    const hull=d3.polygonHull(pts);if(!hull)continue;
    const base=f?(fg===g?1:.4):1, c=gc(g);
    ctx.beginPath();hullLine(hull);
    ctx.fillStyle=rgba(c,.07*base);ctx.fill();
    ctx.lineWidth=1/T.k;ctx.strokeStyle=rgba(c,.24*base);ctx.stroke();
    const below=(anchor[g]||[0,0])[1]>0;
    let ep=hull[0];hull.forEach(p=>{if(below?p[1]>ep[1]:p[1]<ep[1])ep=p});
    ctx.font=`600 ${12/Math.max(T.k,.7)}px ${FONT}`;ctx.textAlign="center";ctx.textBaseline=below?"top":"bottom";
    ctx.fillStyle=rgba(c,.8*base);ctx.fillText(gname(g),ep[0],ep[1]+(below?6:-5)/T.k);
  }
}
function drawLinks(ts){
  const t=ts/1000, ks=Math.sqrt(T.k);
  for(const l of links){
    if(l.a<.01)continue;
    const s=l.source,e=l.target,dx=e.x-s.x,dy=e.y-s.y,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
    const x1=s.x+ux*R(s),y1=s.y+uy*R(s),x2=e.x-ux*(R(e)+2),y2=e.y-uy*(R(e)+2);
    const col=l.h>.02?mix(LINE,ACC,l.h):LINE;
    ctx.globalAlpha=l.a;ctx.strokeStyle=col;
    ctx.lineWidth=(l.strength==="strong"?1.25:.9)*S.line*(1+l.h*.8)/ks;
    ctx.setLineDash(l.strength==="weak"?[1.5,3.5]:l.strength==="contested"?[6,4]:[]);
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.setLineDash([]);
    if(S.arrow){const sz=(4.5+l.h*1.5)*S.line;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x2,y2);
      ctx.lineTo(x2-ux*sz-uy*sz*.55,y2-uy*sz+ux*sz*.55);ctx.lineTo(x2-ux*sz+uy*sz*.55,y2-uy*sz-ux*sz*.55);ctx.closePath();ctx.fill()}
    if(S.flow&&(l.strength==="strong"||l.h>.3)){
      const L=Math.hypot(x2-x1,y2-y1);if(L<8)continue;
      const cnt=Math.max(1,Math.round(L/70)), pc=l.h>.3?ACC:gc(s.group);
      ctx.globalCompositeOperation="lighter";ctx.fillStyle=pc;
      for(let k=0;k<cnt;k++){
        const p=((t*(26+l.h*34))/L+l.seed+k/cnt)%1;
        ctx.globalAlpha=l.a*Math.sin(p*Math.PI)*(.6+l.h*.4);
        ctx.beginPath();ctx.arc(x1+(x2-x1)*p,y1+(y2-y1)*p,(1.7+l.h*.9)/ks,0,7);ctx.fill();
      }
      ctx.globalCompositeOperation="source-over";
    }
  }
  ctx.globalAlpha=1;
}
function drawNodes(f){
  const glow=Math.min(T.k,1.5);
  for(const n of nodes){
    if(n.a<.01)continue;
    const r=R(n),c=gc(n.group),focus=n.id===f;
    ctx.globalAlpha=n.a;
    ctx.shadowColor=focus?ACC:c;ctx.shadowBlur=(focus?24:11)*glow;
    if(focus){
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fillStyle=ACC;ctx.fill();ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(n.x,n.y,r+6,0,7);ctx.strokeStyle=ACC;ctx.lineWidth=1.6;ctx.stroke();
      ctx.beginPath();ctx.arc(n.x,n.y,r*.42,0,7);ctx.fillStyle="#f3efff";ctx.fill();
    }else if(GROUPS[n.group]&&GROUPS[n.group].ring){
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fillStyle=c;ctx.fill();ctx.shadowBlur=0;
      ctx.beginPath();ctx.arc(n.x,n.y,r*.5,0,7);ctx.fillStyle=mix(c,"#ffffff",.72);ctx.fill();
    }else{
      ctx.beginPath();ctx.arc(n.x,n.y,r,0,7);ctx.fillStyle=c;ctx.fill();
    }
    ctx.shadowBlur=0;
  }
  ctx.globalAlpha=1;
}
function drawLabels(f){
  const fs=12.5/Math.max(T.k,.65);
  ctx.font=`${fs}px ${FONT}`;ctx.textAlign="center";ctx.textBaseline="top";ctx.lineJoin="round";
  const za=Math.max(0,Math.min(1,(T.k-S.fade)/.25));
  for(const n of nodes){
    if(n.a<.01)continue;
    const near=f&&(n.id===f||adj.get(f).has(n.id)), a=n.a*(near?1:za);
    if(a<.02)continue;
    const y=n.y+R(n)+(n.id===f?9:5);
    ctx.globalAlpha=a;ctx.lineWidth=3.5/T.k;ctx.strokeStyle="rgba(30,30,30,.85)";ctx.strokeText(n.label,n.x,y);
    ctx.fillStyle=n.id===f?"#ffffff":TEXT;ctx.fillText(n.label,n.x,y);
  }
  ctx.globalAlpha=1;
}
function draw(ts){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=BG;ctx.fillRect(0,0,W,H);
  ctx.save();ctx.translate(T.x,T.y);ctx.scale(T.k,T.k);
  const f=S.hover||S.sel;
  if(S.hull)drawHulls(f);
  drawLinks(ts);drawNodes(f);drawLabels(f);
  ctx.restore();
}

nodes.forEach(n=>{n.tx=n.x;n.ty=n.y});
let introT0=null, introDone=reduced;
function frame(ts){
  if(!introDone){
    if(introT0===null)introT0=ts;
    const p=Math.min(1,(ts-introT0)/1500), e=d3.easeCubicOut(p);
    nodes.forEach(n=>{n.x=n.tx*(.03+.97*e);n.y=n.ty*(.03+.97*e)});
    if(p>=1)introDone=true;
  }
  const ease=(c,t)=>Math.abs(t-c)<.004?t:c+(t-c)*.16;
  nodes.forEach(n=>n.a=ease(n.a,n.ta));
  links.forEach(l=>{l.a=ease(l.a,l.ta);l.h=ease(l.h,l.th)});
  draw(ts);
  requestAnimationFrame(frame);
}

function pick(px,py){const[x,y]=T.invert([px,py]);let best=null,bd=1e9;
  for(const n of nodes){if(n.a<.3&&!(S.hover||S.sel))continue;if(!nodeOn(n))continue;const d=Math.hypot(n.x-x,n.y-y);if(d<R(n)+7/T.k&&d<bd){bd=d;best=n}}return best}
const zoom=d3.zoom().scaleExtent([.25,5])
  .filter(e=>{if(e.type==="wheel")return true;if(e.button)return false;const p=d3.pointer(e,cv);return !pick(p[0],p[1])})
  .on("zoom",e=>{T=e.transform});
d3.select(cv).call(zoom).on("dblclick.zoom",null);
let dragN=null,moved=false;
d3.select(cv).call(d3.drag().container(cv)
  .subject(e=>{const n=pick(e.x,e.y);return n?{n,x:e.x,y:e.y}:null})
  .on("start",e=>{dragN=e.subject.n;moved=false;cv.classList.add("dragging");introDone=true;if(!e.active)sim.alphaTarget(.25).restart();const[x,y]=T.invert([e.x,e.y]);dragN.fx=x;dragN.fy=y})
  .on("drag",e=>{moved=true;const[x,y]=T.invert([e.x,e.y]);dragN.fx=x;dragN.fy=y})
  .on("end",e=>{cv.classList.remove("dragging");if(!e.active)sim.alphaTarget(0);dragN.fx=null;dragN.fy=null;if(!moved)select(dragN.id);dragN=null}));
cv.addEventListener("pointermove",e=>{if(dragN)return;const r=cv.getBoundingClientRect();const n=pick(e.clientX-r.left,e.clientY-r.top);
  cv.style.cursor=n?"pointer":"";const id=n?n.id:null;if(id!==S.hover){S.hover=id;retarget()}});
cv.addEventListener("pointerleave",()=>{if(S.hover){S.hover=null;retarget()}});
cv.addEventListener("click",e=>{const r=cv.getBoundingClientRect();if(!pick(e.clientX-r.left,e.clientY-r.top)&&S.sel)select(null)});

const viewW=()=>W-(W>500?56:48);
function fit(anim){
  const vs=nodes.filter(nodeOn);if(!vs.length)return;
  const xs=vs.map(n=>n.tx??n.x),ys=vs.map(n=>n.ty??n.y);
  const x0=Math.min(...xs)-75,x1=Math.max(...xs)+75,y0=Math.min(...ys)-80,y1=Math.max(...ys)+85;
  const k=Math.min(viewW()/(x1-x0),H/(y1-y0),1.6);
  const t=d3.zoomIdentity.translate(viewW()/2-k*(x0+x1)/2,H/2-k*(y0+y1)/2).scale(k);
  (anim?d3.select(cv).transition().duration(600):d3.select(cv)).call(zoom.transform,t);
}
const syncTargets=()=>{if(introDone)nodes.forEach(n=>{n.tx=n.x;n.ty=n.y})};

let hist=[null],hi=0;
function select(id,push=true){
  if(push&&hist[hi]!==id){hist=hist.slice(0,hi+1);hist.push(id);hi=hist.length-1}
  S.sel=id;retarget();renderNote();renderList();
  if(id){const n=nodes.find(x=>x.id===id);if(n&&nodeOn(n)){const k=Math.max(T.k,1.1);
    d3.select(cv).transition().duration(650).call(zoom.transform,d3.zoomIdentity.translate(viewW()/2-n.x*k,H/2-n.y*k).scale(k))}}
}
const short=u=>{let s=u;try{s=decodeURI(u)}catch(_){}return s.replace(/^https?:\/\/(www\.)?/,"")};
function renderNote(){
  const id=S.sel,n=id?byId.get(id):null;let html,title,status;
  if(!n){
    title=G.meta.title;
    html=`<h1>${esc(G.meta.title)}</h1><div class="chips">${(G.meta.tags||[]).map(t=>`<span class="chip">#${esc(t)}</span>`).join("")}</div>
      ${(G.meta.intro||[]).map(p=>`<p>${esc(p)}</p>`).join("")}
      <h2>关键数据</h2><ul class="facts">${(G.facts||[]).map(f=>`<li><b>${esc(f.topic)}</b>${esc(f.text)}${f.url?`<a href="${esc(f.url)}" target="_blank" rel="noopener">来源 ↗</a>`:""}</li>`).join("")}</ul>
      <details class="srcs"><summary>参考来源（${(G.sources||[]).length}）</summary><ol>${(G.sources||[]).map(u=>`<li><a href="${esc(u)}" target="_blank" rel="noopener">${esc(short(u))}</a></li>`).join("")}</ol></details>`;
    status=`${nodes.length} 个节点 · ${G.links.length} 条关联`;
  }else{
    const outs=G.links.filter(l=>l.source===id),ins=G.links.filter(l=>l.target===id);
    const item=(l,oid)=>{const o=byId.get(oid);return`<li><button class="rel" type="button" data-id="${esc(o.id)}"><span class="dot" style="background:${gc(o.group)}"></span><span class="rl">${esc(o.label)}</span><span class="s ${esc(l.strength)}">${esc(SNAME[l.strength]||l.strength)}</span></button><div class="rn">${esc(l.note)}</div></li>`};
    const c=gc(n.group);
    html=`<h1>${esc(n.label)}</h1><div class="chips"><span class="chip" style="color:${c};background:${rgba(c,.14)}">#${esc(gname(n.group))}</span><span class="chip">${deg.get(n.id)} 条关联</span></div><p>${esc(n.note)}</p>
      ${outs.length?`<h2>出链：它影响了（${outs.length}）</h2><ul class="rels">${outs.map(l=>item(l,l.target)).join("")}</ul>`:""}
      ${ins.length?`<h2>反向链接：它的成因（${ins.length}）</h2><ul class="rels">${ins.map(l=>item(l,l.source)).join("")}</ul>`:""}`;
    status=`${ins.length} 条反向链接 · ${outs.length} 条出链 · ${n.note.length} 字`;title=n.label;
  }
  $("#note").innerHTML=html;$("#ntab").textContent=title;$("#ncrumb").textContent=title;$("#status").textContent=status;
  $("#nscroll").scrollTop=0;$("#nback").disabled=hi<=0;$("#nfwd").disabled=hi>=hist.length-1;$("#nclose").hidden=!n;
}
$("#note").addEventListener("click",e=>{const b=e.target.closest(".rel");if(b)select(b.dataset.id)});
$("#nclose").addEventListener("click",()=>select(null));
$("#nback").addEventListener("click",()=>{if(hi>0){hi--;select(hist[hi],false)}});
$("#nfwd").addEventListener("click",()=>{if(hi<hist.length-1){hi++;select(hist[hi],false)}});

function renderList(){
  const items=nodes.filter(match);
  $("#count").textContent=`${items.length} 个结果`;
  $("#list").innerHTML=gkeys.map(g=>{
    const its=items.filter(n=>n.group===g).sort((a,b)=>deg.get(b.id)-deg.get(a.id));if(!its.length)return"";
    return`<div class="group-h"><span class="dot" style="background:${gc(g)}"></span>${esc(gname(g))}</div>`+
      its.map(n=>`<button class="item${n.id===S.sel?" on":""}" type="button" data-id="${esc(n.id)}"><span class="name">${esc(n.label)}</span><span class="deg">${deg.get(n.id)}</span></button>`).join("")}).join("");
}
const list=$("#list");
list.addEventListener("click",e=>{const b=e.target.closest(".item");if(b)select(b.dataset.id)});
list.addEventListener("mouseover",e=>{const b=e.target.closest(".item");if(b&&S.hover!==b.dataset.id){S.hover=b.dataset.id;retarget()}});
list.addEventListener("mouseleave",()=>{S.hover=null;retarget()});
$("#q").addEventListener("input",e=>{S.q=e.target.value.trim();$("#qclear").hidden=!S.q;retarget();renderList()});
$("#qclear").addEventListener("click",()=>{const q=$("#q");q.value="";q.dispatchEvent(new Event("input"));q.focus()});

$("#groups").innerHTML=gkeys.map(g=>`<div class="row"><label class="g" for="g-${esc(g)}"><span class="dot" style="background:${gc(g)};width:9px;height:9px"></span>${esc(gname(g))}</label><span class="toggle"><input id="g-${esc(g)}" data-g="${esc(g)}" type="checkbox" checked><span></span></span></div>`).join("");
$("#groups").addEventListener("change",e=>{const g=e.target.dataset.g;if(!g)return;e.target.checked?S.hidden.delete(g):S.hidden.add(g);retarget()});
const bind=(id,fn)=>$("#"+id).addEventListener("input",e=>fn(e.target.type==="checkbox"?e.target.checked:+e.target.value));
const kick=()=>{introDone=true;sim.alpha(.6).restart()};
bind("f-weak",v=>{S.weak=v;retarget()});bind("f-cont",v=>{S.cont=v;retarget()});
bind("d-hull",v=>S.hull=v);bind("d-flow",v=>S.flow=v);bind("d-arrow",v=>S.arrow=v);
bind("d-fade",v=>S.fade=v);bind("d-line",v=>S.line=v);
bind("d-size",v=>{S.size=v;sim.force("collide").radius(d=>R(d)+22);kick()});
bind("p-cluster",v=>{sim.force("x").strength(v);sim.force("y").strength(v);kick()});
bind("p-repel",v=>{sim.force("charge").strength(-v);kick()});
bind("p-link",v=>{sim.force("link").strength(v);kick()});
bind("p-dist",v=>{sim.force("link").distance(v);kick()});
if(reduced)$("#d-flow").checked=false;
function relayout(){introDone=true;nodes.forEach(n=>{n.x=(Math.random()-.5)*80;n.y=(Math.random()-.5)*80});sim.alpha(1).restart();
  setTimeout(()=>{syncTargets();fit(true)},1300)}
$("#relayout").addEventListener("click",relayout);$("#t-wand").addEventListener("click",relayout);
$("#t-set").addEventListener("click",()=>{const c=$("#controls");c.hidden=!c.hidden;$("#t-set").classList.toggle("on",!c.hidden)});
$("#t-in").addEventListener("click",()=>d3.select(cv).transition().duration(250).call(zoom.scaleBy,1.35));
$("#t-out").addEventListener("click",()=>d3.select(cv).transition().duration(250).call(zoom.scaleBy,1/1.35));
$("#t-fit").addEventListener("click",()=>{syncTargets();fit(true)});
$("#reset").addEventListener("click",()=>{
  const set=(id,v)=>{const el=$("#"+id);el.type==="checkbox"?el.checked=v:el.value=v;el.dispatchEvent(new Event("input"))};
  set("p-cluster",DEF.cluster);set("p-repel",DEF.repel);set("p-link",DEF.link);set("p-dist",DEF.dist);
  set("d-size",1);set("d-line",1);set("d-fade",.55);set("d-arrow",true);set("d-hull",true);set("d-flow",!reduced);set("f-weak",true);set("f-cont",true);
  document.querySelectorAll("#groups input").forEach(i=>i.checked=true);S.hidden.clear();retarget();
});

size();if(W<600){S.fade=.25;$("#d-fade").value=.25}fit(false);
if(!reduced)nodes.forEach(n=>{n.x=n.tx*.03;n.y=n.ty*.03});
let lastW=W;
new ResizeObserver(()=>{size();if(Math.abs(W-lastW)>40){lastW=W;syncTargets();fit(false)}}).observe(wrap);
renderNote();renderList();retarget();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
